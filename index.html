<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON CORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #05070d; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        h1 { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 5px; }
        .balance { font-size: 32px; font-weight: bold; margin: 20px 0; }
        .tap-btn { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #00f0ff, #0055ff); border: none; font-size: 20px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 0 20px #00f0ff; transition: transform 0.1s; }
        .tap-btn:active { transform: scale(0.95); }
        #status { margin-top: 15px; color: #88a; font-size: 14px; min-height: 20px; }
        
        /* Стилі для екрану помилки */
        .error-screen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: #05070d; position: fixed; inset: 0; z-index: 100; overflow-y: auto; }
        .error-icon { font-size: 60px; margin-bottom: 20px; }
        .error-title { color: #ff4d4d; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .error-text { color: #b0c4de; font-size: 14px; line-height: 1.5; margin-bottom: 20px; max-width: 300px; }
        
        .support-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; width: 100%; max-width: 320px; margin-bottom: 20px; }
        .support-box textarea { width: 100%; height: 80px; background: #05070d; border: 1px solid #334155; color: white; border-radius: 8px; padding: 10px; font-family: inherit; resize: none; box-sizing: border-box; }
        .support-box button { width: 100%; margin-top: 10px; background: #ff4d4d; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .support-box button:active { background: #cc0000; }
        
        .retry-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ГОЛОВНИЙ ЕКРАН -->
    <div id="mainScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh;">
        <h1>NEON CORE</h1>
        <div class="balance" id="balance">0 NC</div>
        <button class="tap-btn" id="tapBtn">TAP</button>
        <div id="status">Готово до гри</div>
    </div>

    <!-- ЕКРАН ПОМИЛКИ -->
    <div class="error-screen" id="errorScreen">
        <div class="error-icon">🚧</div>
        <div class="error-title">Помилка з'єднання</div>
        <div class="error-text">Сервер тимчасово недоступний. Можливо, ваш провайдер блокує з'єднання.</div>
        
        <div class="support-box">
            <div style="font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-align: left;">Опишіть проблему, і ми спробуємо допомогти:</div>
            <textarea id="supportMessage" placeholder="Наприклад: не відкривається гра, помилка з'єднання..."></textarea>
            <button onclick="sendSupport()" id="supportBtn">📨 Надіслати в підтримку</button>
        </div>
        
        <button class="retry-btn" onclick="location.reload()">🔄 Спробувати ще раз</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = "https://neon.91-208-184-101.sslip.io"; 
        const mainScreen = document.getElementById('mainScreen');
        const errorScreen = document.getElementById('errorScreen');
        const statusEl = document.getElementById('status');

        let balance = 0;
        const balanceEl = document.getElementById('balance');
        const tapBtn = document.getElementById('tapBtn');

        // Функція показу екрану помилки
        function showError() {
            mainScreen.style.display = 'none';
            errorScreen.style.display = 'flex';
            tg.HapticFeedback.notificationOccurred('error');
        }

        // Відправка в підтримку
        async function sendSupport() {
            const msg = document.getElementById('supportMessage').value;
            const btn = document.getElementById('supportBtn');
            
            if (!msg.trim()) {
                tg.showAlert("Будь ласка, напишіть текст повідомлення.");
                return;
            }

            btn.innerText = "⏳ Відправляємо...";
            btn.disabled = true;

            try {
                // Навіть якщо основний сервер не працює, спробуємо відправити
                const response = await fetch(API_URL + '/api/support', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        user_id: tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "unknown",
                        username: tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name) : "Гість"
                    })
                });
                
                if (response.ok) {
                    tg.showAlert("✅ Повідомлення надіслано! Адміністратор зв'яжеться з вами найближчим часом.");
                    document.getElementById('supportMessage').value = '';
                } else {
                    throw new Error();
                }
            } catch (e) {
                tg.showAlert("❌ Не вдалося відправити. Сервер недоступний. Спробуйте увімкнути VPN.");
            } finally {
                btn.innerText = "📨 Надіслати в підтримку";
                btn.disabled = false;
            }
        }

        // Логіка гри
        tapBtn.addEventListener('click', async () => {
            balance += 1;
            balanceEl.innerText = balance + ' NC';
            tg.HapticFeedback.impactOccurred('light');

            try {
                const response = await fetch(API_URL + '/api/click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData }
                });
                
                if (!response.ok) throw new Error("Server error");
                
                statusEl.innerText = "✅ Збережено";
                statusEl.style.color = "#5ee0a0";
            } catch (error) {
                statusEl.innerText = "❌ Помилка збереження";
                statusEl.style.color = "#ff6b6b";
                // Показуємо екран помилки ТІЛЬКИ якщо сервер реально не відповів
                setTimeout(showError, 1000); 
            }
        });
    </script>
</body>
</html>
