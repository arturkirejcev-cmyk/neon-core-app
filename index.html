<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON CORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #05070d; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        h1 { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 5px; }
        .balance { font-size: 32px; font-weight: bold; margin: 20px 0; }
        .tap-btn { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #00f0ff, #0055ff); border: none; font-size: 20px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 0 20px #00f0ff; transition: transform 0.1s; }
        .tap-btn:active { transform: scale(0.95); }
        #status { margin-top: 15px; color: #88a; font-size: 14px; min-height: 20px; }
        
        /* Спільні стилі для екранів помилок */
        .error-screen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: #05070d; position: fixed; inset: 0; z-index: 100; overflow-y: auto; }
        .error-icon { font-size: 60px; margin-bottom: 10px; }
        .error-title { color: #ff4d4d; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        
        /* Блок з інструкціями (Крок 1) */
        .steps-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; width: 100%; max-width: 320px; margin-bottom: 20px; text-align: left; box-sizing: border-box; }
        .steps-box div { color: #cbd5e1; font-size: 14px; margin-bottom: 10px; line-height: 1.4; }
        .steps-box div:last-child { margin-bottom: 0; }
        .step-num { color: #00f0ff; font-weight: bold; margin-right: 5px; }
        
        /* Блок для написання адміну (Крок 2) */
        .support-box { display: none; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; width: 100%; max-width: 320px; margin-bottom: 20px; box-sizing: border-box; }
        .support-box textarea { width: 100%; height: 80px; background: #05070d; border: 1px solid #334155; color: white; border-radius: 8px; padding: 10px; font-family: inherit; resize: none; box-sizing: border-box; }
        
        /* Кнопки */
        .action-btn { width: 100%; max-width: 320px; background: #1e293b; border: 1px solid #334155; color: white; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; box-sizing: border-box; }
        .action-btn.primary { background: #ff4d4d; border-color: #ff4d4d; }
        .action-btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- ГОЛОВНИЙ ЕКРАН ГРИ -->
    <div id="mainScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh;">
        <h1>NEON CORE</h1>
        <div class="balance" id="balance">0 NC</div>
        <button class="tap-btn" id="tapBtn">TAP</button>
        <div id="status">Готово до гри</div>
    </div>

    <!-- ЕКРАН ПОМИЛКИ (КРОК 1: ІНСТРУКЦІЇ) -->
    <div class="error-screen" id="errorStep1">
        <div class="error-icon">🚧</div>
        <div class="error-title">Виникла помилка з'єднання</div>
        
        <div class="steps-box">
            <div><span class="step-num">1.</span> Перевірте інтернет.</div>
            <div><span class="step-num">2.</span> Перейдіть з Wi-Fi на мобільний інтернет (4G).</div>
            <div><span class="step-num">3.</span> Якщо не допомогло — увімкніть VPN.</div>
            <div><span class="step-num">4.</span> Перезавантажте сторінку.</div>
        </div>
        
        <button class="action-btn" onclick="location.reload()">🔄 Спробувати ще раз</button>
        <button class="action-btn primary" onclick="showSupportScreen()">😔 Не допомогло, написати адміну</button>
    </div>

    <!-- ЕКРАН ПІДТРИМКИ (КРОК 2: НАПИСАТИ АДМІНУ) -->
    <div class="error-screen" id="errorStep2">
        <div class="error-icon">✉️</div>
        <div class="error-title">Зв'язок з адміністрацією</div>
        <div style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">Опишіть, що саме сталося, і ми спробуємо допомогти.</div>
        
        <div class="support-box" style="display: block;">
            <textarea id="supportMessage" placeholder="Наприклад: натискаю TAP, пише помилку з'єднання..."></textarea>
        </div>
        
        <button class="action-btn primary" onclick="sendSupport()" id="supportBtn">📨 Надіслати повідомлення</button>
        <button class="action-btn" onclick="backToError()">◀️ Назад</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = "https://neon.91-208-184-101.sslip.io"; 
        const mainScreen = document.getElementById('mainScreen');
        const errorStep1 = document.getElementById('errorStep1');
        const errorStep2 = document.getElementById('errorStep2');
        const statusEl = document.getElementById('status');

        let balance = 0;
        const balanceEl = document.getElementById('balance');
        const tapBtn = document.getElementById('tapBtn');

        // --- ЛОГІКА ПОКАЗУ ЕКРАНІВ ---
        function showError() {
            mainScreen.style.display = 'none';
            errorStep1.style.display = 'flex';
            errorStep2.style.display = 'none';
            tg.HapticFeedback.notificationOccurred('error');
        }

        function showSupportScreen() {
            errorStep1.style.display = 'none';
            errorStep2.style.display = 'flex';
        }

        function backToError() {
            errorStep2.style.display = 'none';
            errorStep1.style.display = 'flex';
        }

        // --- ВІДПРАВКА В ПІДТРИМКУ ---
        async function sendSupport() {
            const msg = document.getElementById('supportMessage').value;
            const btn = document.getElementById('supportBtn');
            
            if (!msg.trim()) {
                tg.showAlert("Будь ласка, напишіть текст повідомлення.");
                return;
            }

            btn.innerText = "⏳ Відправляємо...";
            btn.disabled = true;

            try {
                const response = await fetch(API_URL + '/api/support', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        user_id: tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "unknown",
                        username: tg.initDataUnsafe.user ? (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name) : "Гість"
                    })
                });
                
                if (response.ok) {
                    tg.showAlert("✅ Повідомлення надіслано! Адміністратор зв'яжеться з вами.");
                    document.getElementById('supportMessage').value = '';
                    backToError();
                } else {
                    throw new Error();
                }
            } catch (e) {
                tg.showAlert("❌ Не вдалося відправити. Сервер недоступний.");
            } finally {
                btn.innerText = "📨 Надіслати повідомлення";
                btn.disabled = false;
            }
        }

        // --- ЛОГІКА ГРИ ---
        tapBtn.addEventListener('click', async () => {
            balance += 1;
            balanceEl.innerText = balance + ' NC';
            tg.HapticFeedback.impactOccurred('light');

            try {
                const response = await fetch(API_URL + '/api/click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData }
                });
                
                if (!response.ok) throw new Error("Server error");
                
                statusEl.innerText = "✅ Збережено";
                statusEl.style.color = "#5ee0a0";
            } catch (error) {
                statusEl.innerText = "❌ Помилка збереження";
                statusEl.style.color = "#ff6b6b";
                setTimeout(showError, 500); 
            }
        });
    </script>
</body>
</html>
